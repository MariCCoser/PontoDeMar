<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ponto de Mar</title>
  <link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧶</text></svg>">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <button type="button" class="marca" id="marca" title="Clique para colocar o ícone da sua marca"><img id="marca-logo" alt="" class="marca-logo" hidden><span id="marca-emoji">🧶</span> Ponto de Mar</button>
    <input type="file" id="inp-logo" accept="image/*" hidden>
    <nav>
      <button data-aba="inicio">🏡 Início</button>
      <button data-aba="precos">💲 Precificação</button>
      <button data-aba="materiais">🧺 Materiais</button>
      <button data-aba="financeiro">💰 Finanças</button>
      <button data-aba="pessoal">👛 Meu dinheiro</button>
      <button data-aba="receitas">📒 Receitas</button>
      <button data-aba="agenda">📅 Agenda</button>
    </nav>
    <div class="topo-acoes">
      <button class="btn-sec" id="btn-nuvem" hidden>☁️ Entrar</button>
      <button class="btn-sec" id="btn-backup" title="Baixa um arquivo com todos os seus dados">💾 Backup</button>
      <button class="btn-sec" id="btn-importar" title="Recupera os dados de um arquivo de backup">📂 Restaurar</button>
      <input type="file" id="inp-importar" accept=".json,application/json" hidden>
    </div>
  </header>

  <main>
    <section id="aba-inicio" class="aba"></section>
    <section id="aba-precos" class="aba"></section>
    <section id="aba-materiais" class="aba"></section>
    <section id="aba-financeiro" class="aba"></section>
    <section id="aba-pessoal" class="aba"></section>
    <section id="aba-receitas" class="aba"></section>
    <section id="aba-agenda" class="aba"></section>
  </main>

  <!-- Firebase (nuvem). Sem internet, o app continua funcionando só neste computador. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/precificacao.js"></script>
  <script src="js/cronometro.js"></script>
  <script src="js/materiais.js"></script>
  <script src="js/financeiro.js"></script>
  <script src="js/pessoal.js"></script>
  <script src="js/receitas.js"></script>
  <script src="js/agenda.js"></script>
  <script src="js/app.js"></script>
  <script src="js/nuvem.js"></script>
</body>
</html>
